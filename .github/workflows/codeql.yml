# Analyse de sécurité statique du code Java (GitHub CodeQL)
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 4 * * 1'   # chaque lundi : détecte les nouvelles règles sur du code inchangé

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: ./mvnw -B -ntp -DskipTests -Dspotless.check.skip=true package

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:java-kotlin
