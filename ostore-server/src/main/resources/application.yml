spring:
  application:
    name: ostore
  threads:
    virtual:
      # Directive projet : toutes les requêtes et tâches planifiées s'exécutent sur des virtual threads.
      enabled: true
  mvc:
    problemdetails:
      # Erreurs de l'API REST au format RFC 9457 (ProblemDetail).
      enabled: true
  flyway:
    # Un répertoire de scripts par SGBD ({vendor} = postgresql | oracle), ADR-0005.
    locations: classpath:db/migration/{vendor}

springdoc:
  # Seule l'API REST est décrite (pas les endpoints techniques).
  paths-to-match: /api/**

ostore:
  storage:
    # Instance de driver attribuée aux nouveaux buckets.
    default-driver: local
    # Instances de drivers (ADR-0007, ADR-0015). "layout" (optionnel) : date | hashed | flat,
    # sinon la stratégie recommandée par le driver (date). Le chemin calculé est stocké en base.
    drivers:
      local:
        type: filesystem
        properties:
          root: ./data/blobs
  purge:
    # Suppression asynchrone des blobs remplacés ou supprimés (ADR-0006).
    interval: PT30S
    batch-size: 100
    max-backoff: PT1H
  database:
    # Oracle uniquement : tablespaces dédiés (vides = tablespace par défaut du schéma).
    table-tablespace:
    index-tablespace:
